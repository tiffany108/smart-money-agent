name: Smart Money — Full Pipeline

# ───────────────────────────────────────────────────────────────────────────
#  PAUSED 15 August 2026 — waiting on Meta App Review.
#
#  The push trigger is commented out, so this workflow now runs ONLY when you
#  start it by hand from the Actions tab. Pushing code will not spend Anthropic
#  credits drafting posts that cannot be published yet.
#
#  TO RESUME: uncomment the push block below and commit.
# ───────────────────────────────────────────────────────────────────────────
on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '**.md'
  #     - '.gitignore'
  workflow_dispatch:

jobs:
  collect-and-summarise:
    runs-on: ubuntu-latest

    # Hard cap so a hung job can never burn hours of Actions minutes again.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, not 18: @supabase/supabase-js requires a native WebSocket,
      # which Node 18 lacks — createClient() throws before any work happens.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run news collector
        timeout-minutes: 6
        run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}

      - name: Run AI summariser
        timeout-minutes: 6
        run: npm run summarise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
